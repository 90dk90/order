# PD transport: VXLAN only (GRE retired).
#
# Digi VPP (L2 VXLAN + BVI loop208) ↔ VPS Linux (classic VXLAN + /30).
# Underlay now: Proximus (tap36→Linux) while Digi PPPoE is off.
# Target underlay: Digi PPPoE IPv6 on x520wan (cutover via pd-vpp-digi-vxlan-cutover.sh).

VXLAN_VNI=100
VXLAN_PORT=4789
VXLAN_MTU=1400

# Inner PD /30 (was "lab"; now production inner)
LAB_DIGI=172.16.208.2
LAB_VPS=172.16.208.1
LAB_PREFIX=172.16.208.0/30

LAB_DIGI_MAC=de:ad:00:00:00:d1
LAB_VPS_MAC=de:ad:00:00:00:d2

LAB_BD=208
LAB_LOOP=loop208
LAB_VXLAN_INSTANCE=208

# VPS fixed VTEPs
PD_VTEP=2a0e:97c0:4c1::60
VPS_V4=77.90.4.48

# Policy
PD_TRANSPORT=vxlan
PD_GRE=0
PBR_TABLE=81
LAN_PREFIX=79.172.242.0/24
HAIRPIN_HOSTS="79.172.242.1 79.172.242.2 79.172.242.3 79.172.242.10 79.172.242.48"

# Proximus interim underlay (until Digi PPPoE cutover)
PROX_LOCAL=192.168.129.7
PROX_VPP_IP=192.168.129.8/23
PROX_TAP_ID=36
PROX_TAP_HOST_IF=vpp-prox
PROX_TAP_VPP=10.255.36.1/30
PROX_TAP_HOST=10.255.36.2/30
PROX_GW=192.168.128.1
PROX_HOST_IF=enp36s0
DIGI_PROX_PUB_DEFAULT=91.179.61.119
