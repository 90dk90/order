# Parallel VXLAN lab (does NOT replace PD GRE).
# Goal: UDP outer + sport entropy → X520 RSS multi-queue, without touching gre0.
#
# Digi VPP (L2 VXLAN + BVI) ↔ VPS Linux (classic VXLAN + /30).
# VXLAN-GPE L3 was rejected for this lab: Linux GPE requires "external"
# and is not a simple P2P peer to VPP next-ip4.

VXLAN_VNI=100
VXLAN_PORT=4789
VXLAN_MTU=1400

# Inner lab /30 (separate from GRE 172.16.207.0/30)
LAB_DIGI=172.16.208.2
LAB_VPS=172.16.208.1
LAB_PREFIX=172.16.208.0/30

# Stable MACs for static neigh across the L2 VXLAN
LAB_DIGI_MAC=de:ad:00:00:00:d1
LAB_VPS_MAC=de:ad:00:00:00:d2

# Digi VPP objects
LAB_BD=208
LAB_LOOP=loop208
LAB_VXLAN_INSTANCE=208

# Outer VTEPs (VPS fixed; Digi = live PPPoE wan-ipv6)
PD_VTEP=2a0e:97c0:4c1::60

# --- Temporary Proximus hairpin (while Digi GRE6 down) ---
# Bridges VPP PBR table 81 → Linux tap → vxlan-prox → VPS.
# Tear down with *-off.sh once GRE6 is healthy again.
HAIRPIN_TAP_ID=208
HAIRPIN_TAP_HOST_IF=vpp-vxlan-lab
HAIRPIN_TAP_VPP=10.255.208.1/30
HAIRPIN_TAP_HOST=10.255.208.2/30
HAIRPIN_RT_TABLE=208
HAIRPIN_HOSTS="79.172.242.1 79.172.242.2 79.172.242.3 79.172.242.10"
PBR_TABLE=81
LAN_PREFIX=79.172.242.0/24
PROX_LOCAL=192.168.129.7
VPS_V4=77.90.4.48
