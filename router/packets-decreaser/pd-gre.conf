PD_VTEP=2a0e:97c0:4c1::60
PD_VTEP_V4=77.90.4.48
PD_VPS_SSH=root@77.90.4.48
PD_SSH_KEY=/root/.ssh/id_ed25519_pd_vps
INNER_LOCAL=172.16.207.2/30
INNER_PEER=172.16.207.1
PBR_TABLE=81
PROX_IF=enp36s0
# Pin Proximus GRE local (primary LAN IP — NAT delivers inbound to this addr).
# Leave empty to auto-pick first global inet on PROX_IF.
PD_PROX_LOCAL=192.168.129.7
# auto | proximus | digi
PD_UNDERLAY=proximus
# GRE-over-UDP (FOU) for Proximus NAT — auto|1|0 (auto=on when local is private)
PD_GRE_FOU=auto
FOU_PORT=4754
GRE_MTU=1400
# Do not enable until VPP is stable under tap create
PD_ENABLE_EXIT_TAP=0
