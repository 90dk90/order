# Digi sticky exceptions — matching traffic stays on PD (/24), never Digi CGNAT SNAT.
#
# Reload after edits:
#   /usr/local/sbin/digi-sticky-except-reload.sh
#
# Syntax (one per line):
#   src <ipv4>       packets FROM this source IP → PD
#   dst <ipv4>       packets TO this destination IP → PD
#   domain <fqdn>    resolve A records → same as dst (refresh on each reload)
#
# Examples:
#   domain api.lumenvm.cloud
#   src 79.172.242.3
#   dst 1.2.3.4

# LumenVM license / status API (must not use Digi CGNAT)
domain api.lumenvm.cloud

# Dedicated IP VMs — keep off Digi (optional)
src 79.172.242.3
src 79.172.242.10
src 79.172.242.48
