unix {
  nodaemon
  log /var/log/vpp/vpp.log
  full-coredump
  cli-listen /run/vpp/cli.sock
  gid vpp
}

plugins {
  plugin linux_cp_plugin.so { enable }
  plugin linux_nl_plugin.so { enable }
}

api-trace {
  on
}

api-segment {
  gid vpp
}

socksvr {
  default
}

memory {
  main-heap-size 2G
  main-heap-page-size default-hugepage
}

buffers {
  buffers-per-numa 262144
  default data-size 2048
  page-size default-hugepage
}

cpu {
  main-core 0
  # Leave CPU1 for Linux PPPoE/underlay softpath (RPS/XPS 0-1).
  # 4 DPDK workers remain enough for 10G L2/GRE.
  corelist-workers 2-5
  scheduler-policy other
}

dpdk {
  uio-driver uio_pci_generic
  socket-mem 2048
  dev 0000:2b:00.0 {
    name x520wan
    num-rx-queues 4
    num-tx-queues 4
    num-rx-desc 4096
    num-tx-desc 4096
  }
  dev 0000:2b:00.1 {
    name x520lan
    num-rx-queues 4
    num-tx-queues 4
    num-rx-desc 4096
    num-tx-desc 4096
  }
  dev 0000:01:00.0 {
    name x520extra0
    num-rx-queues 4
    num-tx-queues 4
    num-rx-desc 4096
    num-tx-desc 4096
  }
  dev 0000:01:00.1 {
    name x520extra1
    num-rx-queues 4
    num-tx-queues 4
    num-rx-desc 4096
    num-tx-desc 4096
  }
}
