unix {
  nodaemon
  log /var/log/vpp/vpp.log
  full-coredump
  cli-listen /run/vpp/cli.sock
  gid vpp
}

plugins {
  # Slim load: only Digi/GRE/LAN dataplane plugins.
  plugin default { disable }

  plugin dpdk_plugin.so { enable }
  plugin linux_cp_plugin.so { enable }
  plugin linux_nl_plugin.so { enable }
  plugin gre_plugin.so { enable }
  plugin tap_plugin.so { enable }
  plugin ppp_plugin.so { enable }
  plugin pppoe_plugin.so { enable }
  plugin pppoeclient_plugin.so { enable }
  plugin dhcp_plugin.so { enable }
  plugin ping_plugin.so { enable }
  plugin arping_plugin.so { enable }
  plugin mss_clamp_plugin.so { enable }
  plugin l2_mss_clamp_plugin.so { enable }

  # Digi CGNAT (ACL required by NAT feature arcs). abf kept for future
  # VPP-native sticky — production sticky is still Linux L3 hairpin.
  plugin acl_plugin.so { enable }
  plugin nat_plugin.so { enable }
  plugin nat44_ei_plugin.so { enable }
  plugin abf_plugin.so { enable }
}

# Do not include an empty api-trace {} block — VPP aborts on unknown empty input.

api-segment {
  gid vpp
}

socksvr {
  default
}

memory {
  main-heap-size 2G
  main-heap-page-size default-hugepage
}

buffers {
  buffers-per-numa 262144
  default data-size 2048
  page-size default-hugepage
}

cpu {
  main-core 0
  # Leave CPU1 for Linux / Bird / sync SSH.
  # VPP workers 2-5 (isolcpus).
  corelist-workers 2-5
  # SCHED_FIFO needs an explicit RT priority or VPP keeps SCHED_OTHER.
  scheduler-policy fifo
  scheduler-priority 1
}

dpdk {
  uio-driver uio_pci_generic
  socket-mem 2048
  # Intel X520/82599 hard-caps RX/TX descriptors at 4096 (8192 will not probe).
  dev 0000:2b:00.0 {
    name x520wan
    num-rx-queues 4
    num-tx-queues 4
    num-rx-desc 4096
    num-tx-desc 4096
  }
  dev 0000:2b:00.1 {
    name x520lan
    num-rx-queues 4
    num-tx-queues 4
    num-rx-desc 4096
    num-tx-desc 4096
  }
  dev 0000:01:00.0 {
    name x520extra0
    num-rx-queues 4
    num-tx-queues 4
    num-rx-desc 4096
    num-tx-desc 4096
  }
  dev 0000:01:00.1 {
    name x520extra1
    num-rx-queues 4
    num-tx-queues 4
    num-rx-desc 4096
    num-tx-desc 4096
  }
}
