[Unit]
# pveproxy binds LISTEN_IP=Tailscale — wait for tailscaled + address
After=tailscaled.service network-online.target
Wants=tailscaled.service

[Service]
ExecStartPre=/usr/local/sbin/pveproxy-wait-listen-ip.sh
# Survive boot races / Tailscale coming up late
Restart=on-failure
RestartSec=3
StartLimitIntervalSec=0
